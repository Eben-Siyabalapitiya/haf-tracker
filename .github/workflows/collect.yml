name: Collect votes

on:
  # Each run collects every 30 seconds for ~5.5 hours, then starts the next run itself,
  # so collection doesn't depend on GitHub's scheduler (which can be late or skip runs).
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long this run keeps collecting (minutes)"
        default: "330"
  # Restart right away when the collector itself changes.
  push:
    branches: [main]
    paths:
      - "collector/**"
      - "scripts/collect_loop.sh"
      - ".github/workflows/collect.yml"
  # Backup in case the chain ever breaks. Queues behind a running collector.
  schedule:
    - cron: "*/30 * * * *"

permissions: {}

# One collector at a time. A newer run waits instead of overlapping, except that a push
# with new collector code replaces the running one right away.
concurrency:
  group: collect-votes
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  STOP_AFTER: "2026-11-01T05:00:00Z"   # an hour after voting closes

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
      issues: write      # posts removed projects and vote drops to the "Vote alerts" issue
    outputs:
      changed: ${{ steps.loop.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect snapshots
        id: loop
        env:
          MINUTES: ${{ inputs.minutes || '330' }}
          INTERVAL: "30"
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Data commits are attributed to the repository owner.
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"
          if [[ "$(date -u +%FT%TZ)" > "$STOP_AFTER" ]]; then
            MINUTES=1
          fi
          bash scripts/collect_loop.sh

  deploy:
    needs: collect
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/site.yml

  next:
    needs: collect
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Start the next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$(date -u +%FT%TZ)" > "$STOP_AFTER" ]]; then
            echo "Voting is over; not starting another run."
            exit 0
          fi
          gh workflow run collect.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
